<ng-container *tieneRol="['administrador', 'veterinario']; sino: sinPermiso">
  <div class="tarjeta-centrada" *ngIf="datos">
    <app-encabezado-pagina [titulo]="titulo" [subtitulo]="datos.mascota.nombre + ' · ' + (datos.dueno?.nombreCompleto ?? '')"></app-encabezado-pagina>

    <div *ngIf="cita" class="alert alert-info small d-flex align-items-center gap-2">
      <i class="bi bi-calendar-check" aria-hidden="true"></i>
      Atención de la cita del {{ cita.fecha | fechaHora }} a las {{ cita.hora | hora12 }}. Al guardar, la cita quedará como atendida.
    </div>
    <div *ngIf="datos.mascota.alergias.length > 0" class="alert alert-warning small">
      <strong>Alergias:</strong> {{ datos.mascota.alergias.join(', ') }}
    </div>

    <form class="card tarjeta-veterio" [formGroup]="formulario" (ngSubmit)="guardar()" novalidate>
      <div class="card-body p-3 p-md-4">
        <app-seccion-numerada [numero]="1" titulo="Datos de la atención">
          <div class="row g-3">
            <div class="col-6 col-md-4">
              <label for="fecha" class="form-label">Fecha</label>
              <input id="fecha" type="date" class="form-control" formControlName="fecha" [max]="hoy" />
              <app-errores-campo [control]="formulario.controls.fecha"></app-errores-campo>
            </div>
            <div class="col-6 col-md-4">
              <label for="tipo" class="form-label">Tipo</label>
              <select id="tipo" class="form-select" formControlName="tipo">
                <option *ngFor="let tipo of tipos" [value]="tipo[0]">{{ tipo[1] }}</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="veterinario" class="form-label">Veterinario</label>
              <select id="veterinario" class="form-select" formControlName="veterinarioId">
                <option value="">Selecciona</option>
                <option *ngFor="let veterinario of veterinarios" [value]="veterinario.id">{{ veterinario.nombreCompleto }}</option>
              </select>
              <app-errores-campo [control]="formulario.controls.veterinarioId"></app-errores-campo>
            </div>
            <div class="col-12">
              <label for="motivo" class="form-label">Motivo de la consulta</label>
              <input id="motivo" class="form-control" formControlName="motivo" autoenfoque />
              <app-errores-campo [control]="formulario.controls.motivo"></app-errores-campo>
            </div>
          </div>
        </app-seccion-numerada>

        <app-seccion-numerada [numero]="2" titulo="Examen">
          <div class="row g-3">
            <div class="col-4">
              <label for="peso" class="form-label">Peso (kg)</label>
              <input id="peso" type="number" step="0.01" class="form-control" formControlName="peso" />
              <app-errores-campo [control]="formulario.controls.peso"></app-errores-campo>
            </div>
            <div class="col-4">
              <label for="temperatura" class="form-label">Temp. (°C)</label>
              <input id="temperatura" type="number" step="0.1" class="form-control" formControlName="temperatura" />
              <app-errores-campo [control]="formulario.controls.temperatura"></app-errores-campo>
            </div>
            <div class="col-4">
              <label for="costo" class="form-label">Costo (S/)</label>
              <input id="costo" type="number" step="0.5" min="0" class="form-control" formControlName="costo" />
              <app-errores-campo [control]="formulario.controls.costo"></app-errores-campo>
            </div>
            <div class="col-md-6">
              <label for="diagnostico" class="form-label">Diagnóstico</label>
              <textarea id="diagnostico" class="form-control" rows="3" formControlName="diagnostico"></textarea>
              <app-errores-campo [control]="formulario.controls.diagnostico"></app-errores-campo>
            </div>
            <div class="col-md-6">
              <label for="tratamiento" class="form-label">Tratamiento</label>
              <textarea id="tratamiento" class="form-control" rows="3" formControlName="tratamiento"></textarea>
              <app-errores-campo [control]="formulario.controls.tratamiento"></app-errores-campo>
            </div>
          </div>
        </app-seccion-numerada>

        <app-seccion-numerada [numero]="3" titulo="Medicamentos">
          <div formArrayName="medicamentos" class="d-flex flex-column gap-3">
            <p *ngIf="medicamentos.length === 0" class="small text-secondary mb-0">No se agregaron medicamentos.</p>
            <div *ngFor="let grupo of medicamentos.controls; let i = index" [formGroupName]="i" class="medicamento">
              <div class="row g-2 align-items-start">
                <div class="col-md-4">
                  <label [for]="'med-nombre-' + i" class="form-label small">Nombre</label>
                  <input [id]="'med-nombre-' + i" class="form-control form-control-sm" formControlName="nombre" [autoenfoque]="medicamentos.dirty" />
                  <app-errores-campo [control]="grupo.controls.nombre"></app-errores-campo>
                </div>
                <div class="col-6 col-md-2">
                  <label [for]="'med-dosis-' + i" class="form-label small">Dosis</label>
                  <input [id]="'med-dosis-' + i" class="form-control form-control-sm" formControlName="dosis" placeholder="5 mg" />
                  <app-errores-campo [control]="grupo.controls.dosis"></app-errores-campo>
                </div>
                <div class="col-6 col-md-3">
                  <label [for]="'med-frecuencia-' + i" class="form-label small">Frecuencia</label>
                  <input [id]="'med-frecuencia-' + i" class="form-control form-control-sm" formControlName="frecuencia" />
                  <app-errores-campo [control]="grupo.controls.frecuencia"></app-errores-campo>
                </div>
                <div class="col-8 col-md-2">
                  <label [for]="'med-dias-' + i" class="form-label small">Días</label>
                  <input [id]="'med-dias-' + i" type="number" min="1" class="form-control form-control-sm" formControlName="dias" />
                  <app-errores-campo [control]="grupo.controls.dias"></app-errores-campo>
                </div>
                <div class="col-4 col-md-1 d-flex align-items-end h-100">
                  <button type="button" class="btn btn-sm btn-outline-danger w-100 mt-md-4" [attr.aria-label]="'Quitar medicamento ' + (i + 1)" (click)="quitarMedicamento(i)">
                    <i class="bi bi-trash" aria-hidden="true"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <button type="button" class="btn btn-sm btn-suave mt-3" (click)="agregarMedicamento()">
            <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Agregar medicamento
          </button>
        </app-seccion-numerada>

        <app-seccion-numerada [numero]="4" titulo="Próximo control">
          <div class="form-check form-switch mb-2">
            <input id="programar" class="form-check-input" type="checkbox" role="switch" formControlName="programarControl" />
            <label for="programar" class="form-check-label">Indicar fecha de próximo control</label>
          </div>
          <div *ngIf="formulario.controls.programarControl.value" class="col-md-4">
            <label for="proximo" class="form-label">Fecha</label>
            <input id="proximo" type="date" class="form-control" formControlName="proximoControl" [min]="hoy" />
            <app-errores-campo [control]="formulario.controls.proximoControl"></app-errores-campo>
          </div>
        </app-seccion-numerada>
      </div>

      <div class="card-footer bg-white d-flex flex-column flex-sm-row justify-content-end gap-2 p-3">
        <button type="button" class="btn btn-outline-secondary" (click)="cancelar()">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="guardando">Guardar atención</button>
      </div>
    </form>
  </div>
</ng-container>

<ng-template #sinPermiso>
  <app-estado-vacio icono="bi-lock" titulo="Sin permiso" mensaje="Solo los veterinarios pueden registrar atenciones."></app-estado-vacio>
</ng-template>
