<app-encabezado-pagina titulo="Historial clínico" subtitulo="Busca una mascota para ver sus atenciones"></app-encabezado-pagina>

<div class="card tarjeta-veterio mb-3">
  <div class="card-body">
    <app-buscador-texto placeholder="Nombre de la mascota, dueño o DNI" (buscar)="buscar($event)"></app-buscador-texto>
  </div>
</div>

<div *ngIf="items.length > 0; else vacio" class="row g-3">
  <div class="col-sm-6 col-xl-4" *ngFor="let item of items; trackBy: seguirPorId">
    <button type="button" class="card tarjeta-veterio opcion w-100 text-start" (click)="abrir(item.mascota.id)">
      <span class="card-body d-flex align-items-center gap-3 w-100">
        <app-avatar-especie [especie]="item.mascota.especie" [nombre]="item.mascota.nombre"></app-avatar-especie>
        <span class="flex-grow-1 min-w-0">
          <span class="d-block fw-semibold">{{ item.mascota.nombre }}</span>
          <span class="d-block small text-secondary text-truncate">{{ item.dueno?.nombreCompleto }}</span>
          <span class="d-block small text-secondary">
            {{ item.ultimaAtencion ? 'Última atención: ' + (item.ultimaAtencion | fechaHora) : 'Sin atenciones' }}
          </span>
        </span>
        <i class="bi bi-chevron-right text-secondary" aria-hidden="true"></i>
      </span>
    </button>
  </div>
</div>

<ng-template #vacio>
  <div class="card tarjeta-veterio">
    <app-estado-vacio
      imagen="imagenes/vacio-historial.png"
      icono="bi-journal-medical"
      titulo="Sin resultados"
      mensaje="No encontramos mascotas con ese dato."
    ></app-estado-vacio>
  </div>
</ng-template>
