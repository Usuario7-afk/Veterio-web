<div class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite" aria-atomic="true">
  <div
    *ngFor="let aviso of avisos$ | async; trackBy: seguirPorId"
    class="toast show align-items-center border-0"
    [ngClass]="clase(aviso)"
    role="status"
  >
    <div class="d-flex">
      <div class="toast-body">
        <i class="bi me-2" [ngClass]="icono(aviso)" aria-hidden="true"></i>{{ aviso.mensaje }}
      </div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        aria-label="Cerrar aviso"
        (click)="cerrar(aviso)"
      ></button>
    </div>
  </div>
</div>
