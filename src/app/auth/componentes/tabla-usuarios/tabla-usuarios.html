<div class="table-responsive">
  <table class="table align-middle mb-0">
    <thead>
      <tr>
        <th scope="col">Nombre</th>
        <th scope="col">Correo</th>
        <th scope="col">Rol</th>
        <th scope="col">Estado</th>
        <th scope="col" class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let usuario of usuarios; trackBy: seguirPorId" [class.text-secondary]="!usuario.activo">
        <td>
          <div class="fw-semibold">{{ usuario.nombre }}</div>
          <div *ngIf="usuario.veterinarioId" class="small text-secondary">
            {{ nombresVeterinario[usuario.veterinarioId] }}
          </div>
          <span *ngIf="usuario.id === idActual" class="badge text-bg-light border">Tu cuenta</span>
        </td>
        <td class="text-break">{{ usuario.correo }}</td>
        <td>{{ usuario.rol | rol }}</td>
        <td>
          <span class="badge rounded-pill" [ngClass]="usuario.activo ? 'badge-estado-atendida' : 'text-bg-light border'">
            {{ usuario.activo ? 'Activo' : 'Inactivo' }}
          </span>
        </td>
        <td class="text-end text-nowrap">
          <button type="button" class="btn btn-sm btn-suave me-1" (click)="editar.emit(usuario.id)">
            <i class="bi bi-pencil me-1" aria-hidden="true"></i>Editar
          </button>
          <button
            *ngIf="usuario.id !== idActual"
            type="button"
            class="btn btn-sm"
            [ngClass]="usuario.activo ? 'btn-outline-danger' : 'btn-outline-success'"
            [confirmarAccion]="mensajeEstado(usuario)"
            [tituloConfirmacion]="usuario.activo ? 'Desactivar cuenta' : 'Activar cuenta'"
            [textoConfirmar]="usuario.activo ? 'Desactivar' : 'Activar'"
            [varianteConfirmacion]="usuario.activo ? 'danger' : 'primary'"
            (confirmado)="cambiarEstado.emit({ id: usuario.id, activo: !usuario.activo })"
          >
            {{ usuario.activo ? 'Desactivar' : 'Activar' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
